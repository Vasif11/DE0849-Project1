# Application server of Scenario A (Nginx, 10.0.4.10:8080)
log_format timed '$remote_addr:$remote_port -> $server_addr:$server_port "$request" '
                 '$status $body_bytes_sent rt=$request_time conn=$connection reqs=$connection_requests';

server {
    listen 8080;
    server_name app.scenario-a;
    access_log /var/log/nginx/access.log timed;

    root /usr/share/nginx/html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
    }

    location /files/ {
        default_type application/octet-stream;
    }

    location / {
        index index.html;
        add_header X-Served-By "scena-nginx" always;
    }
}
