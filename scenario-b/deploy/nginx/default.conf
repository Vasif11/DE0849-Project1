# Application server of Scenario B (Nginx on the N6 data network)
log_format timed '$remote_addr:$remote_port -> $server_addr:$server_port "$request" '
                 '$status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name app.scenario-b;
    access_log /var/log/nginx/access.log timed;
    root /usr/share/nginx/html;

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /nginx_status { stub_status; }
    location /files/ { default_type application/octet-stream; }
    location / { index index.html; add_header X-Served-By "scenario-b-nginx" always; }
}
